<html>
<head>
<title>Factorial No</title>
</head>
<body>
<h2> Factorial Program</h2>
Enter the number:
<input type="number" id="num">
<button onclick="factp()" >Find Factorial</button>
<p id="result"></p>

<script>
function factp()
{
let n= document.getElementById("num").value;
let fact=1;

for(let i=1;i<=n;i++)
{
fact=fact*i;
}

document.getElementById("result").innerHTML="Factorial of"+n+ "is"+fact;
}

</script>
</body>
</html>
